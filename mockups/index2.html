<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup 2 - Dark Mode Sleek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --surface: #1E293B;
            --primary: #F59E0B; /* Amber/Gold */
            --primary-hover: #D97706;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
        }
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Topbar */
        .topbar { background-color: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 8px 15px; border-radius: 8px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background-color: var(--bg-color); color: var(--primary); }
        
        /* Container */
        .layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .search-area { margin-bottom: 30px; }
        .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: white; padding: 15px 20px; border-radius: 12px; font-size: 16px; outline: none; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
        
        /* Categories */
        .categories { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px;}
        .cat-badge { background: var(--surface); padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); }
        .cat-badge.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;}
        .product-card:hover { border-color: var(--primary); transform: scale(1.02); }
        .product-name { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 20px; }
        
        /* Cart Sidebar */
        .cart-sidebar { width: 380px; background-color: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--bg-color); padding: 15px; border-radius: 10px; }
        .qty-input { width: 50px; background: var(--surface); border: 1px solid var(--border); color: white; text-align: center; border-radius: 6px; padding: 5px; font-weight: bold;}
        .remove-btn { color: #EF4444; background: none; border: none; cursor: pointer; font-size: 18px; }
        
        /* Total */
        .cart-footer { padding: 20px; background: #0B1120; border-top: 1px solid var(--border); }
        .total-line { display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; margin-bottom: 15px; color: var(--primary); }
        .btn-action { width: 100%; background: var(--primary); color: #000; font-weight: bold; font-size: 18px; border: none; padding: 15px; border-radius: 10px; cursor: pointer; }
        .btn-action:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">CRISPY<span style="color:white">APP</span></div>
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="bi bi-grid-fill"></i> Caja</a>
            <a href="#" class="nav-item"><i class="bi bi-receipt"></i> Ventas</a>
            <a href="#" class="nav-item"><i class="bi bi-tags"></i> Menú</a>
            <a href="#" class="nav-item"><i class="bi bi-box"></i> Stock</a>
        </div>
        <div class="user-profile" style="display:flex; align-items:center; gap:10px;">
            <div style="width:35px; height:35px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:black; font-weight:bold;">A</div>
            <span>Admin</span>
        </div>
    </div>
    
    <div class="layout">
        <div class="main-content">
            <div class="search-area">
                <input type="text" class="search-input" placeholder="🔍 Buscar productos, códigos o categorías...">
            </div>
            
            <div class="categories">
                <div class="cat-badge active">Todos</div>
                <div class="cat-badge">Pollos</div>
                <div class="cat-badge">Bebidas</div>
                <div class="cat-badge">Promociones</div>
                <div class="cat-badge">Guarniciones</div>
            </div>
            
            <div class="grid">
                <div class="product-card">
                    <div class="product-name">1/4 Pollo a la Brasa</div>
                    <div class="product-price">$ 18,000</div>
                    <span style="position:absolute; top:10px; right:10px; color:var(--text-muted)"><i class="bi bi-plus-circle"></i></span>
                </div>
                <div class="product-card">
                    <div class="product-name">1/2 Pollo a la Brasa</div>
                    <div class="product-price">$ 35,000</div>
                    <span style="position:absolute; top:10px; right:10px; color:var(--text-muted)"><i class="bi bi-plus-circle"></i></span>
                </div>
                <div class="product-card">
                    <div class="product-name">Postobón 1.5L</div>
                    <div class="product-price">$ 8,000</div>
                    <span style="position:absolute; top:10px; right:10px; color:var(--text-muted)"><i class="bi bi-plus-circle"></i></span>
                </div>
            </div>
        </div>
        
        <div class="cart-sidebar">
            <div class="cart-header">
                Orden en Curso
            </div>
            <div class="cart-items">
                <div class="cart-item">
                    <div>
                        <div style="font-weight:bold; margin-bottom:5px;">Combo Familiar</div>
                        <div style="color:var(--primary)">$ 75,000</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="number" class="qty-input" value="1">
                        <button class="remove-btn"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>
            <div class="cart-footer">
                <div class="total-line">
                    <span>Total</span>
                    <span>$ 75,000</span>
                </div>
                <button class="btn-action">Procesar Pago (Enter)</button>
            </div>
        </div>
    </div>
</body>
</html>
